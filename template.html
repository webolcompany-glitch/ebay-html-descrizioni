<style>

* {
    box-sizing:border-box;
}

.product-container {
    max-width:1100px;
    margin:auto;
    font-family:Arial, Helvetica, sans-serif;
    color:#333;
    font-size:15px;
    line-height:1.6;
}


.title-box {
    background:#e28413;
    padding:20px;
    text-align:center;
}


.title-box h1 {
    margin:0;
    font-size:30px;
    color:#ffffff;
}


.title-box p {
    color:#ffffff;
}


.section {
    width:100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    margin-top:20px;
}


.image-box {
    width:42%;
    padding:15px;
    text-align:center;
}


.image-box img {
    width:100%;
    max-width:450px;
    height:auto;
    border:1px solid #ddd;
}


.text-box {
    width:58%;
    padding:20px;
}


h2 {
    color:#e28413;
}


.info-box {
    background:#fafafa;
    border:1px solid #ddd;
    padding:20px;
    margin-top:20px;
}


.gallery {
    display:flex;
    flex-wrap:wrap;
}


.gallery img {
    width:50%;
    padding:6px;
}


table {
    width:100%;
    border-collapse:collapse;
}


td {
    border:1px solid #ccc;
    padding:8px;
}


td:first-child {
    background:#f5f5f5;
    font-weight:bold;
}


@media only screen and (max-width:600px){

    .title-box h1 {
        font-size:22px;
    }

    .section {
        display:block;
    }


    .image-box,
    .text-box {
        width:100%;
        padding:10px;
    }


    .image-box img {
        max-width:100%;
    }


    .gallery img {
        width:100%;
    }


    p, li, td {
        font-size:15px;
    }

}

</style>


<div class="product-container">


<!-- TITOLO -->

<div class="title-box">

<h1>
{{TITOLO}}
</h1>


<p>
{{SOTTOTITOLO}}
</p>

</div>



<!-- DESCRIZIONE -->

<div class="section">


<div class="image-box">

<img src="{{FOTO1}}" alt="{{TITOLO}}">

</div>



<div class="text-box">

<h2>
Descrizione
</h2>


{{DESCRIZIONE}}


</div>


</div>





<!-- CARATTERISTICHE -->

<div class="section info-box">


<div class="text-box">


<h2>
Caratteristiche principali
</h2>


<ul>

{{CARATTERISTICHE}}

</ul>


</div>



<div class="image-box">


<img src="{{FOTO2}}" alt="{{TITOLO}}">


</div>


</div>





<!-- DATI TECNICI -->


<div class="section">


<div class="image-box">


<img src="{{FOTO3}}" alt="{{TITOLO}}">


</div>




<div class="text-box">


<h2>
Dati tecnici
</h2>


<table>


<tbody>

{{DATI_TECNICI}}


</tbody>


</table>


</div>


</div>





<!-- GALLERIA -->


<h2 style="text-align:center;">
Galleria immagini
</h2>



<div class="gallery">


{{GALLERIA}}


</div>





<!-- CONTENUTO -->


<div class="info-box">


<h2>
Contenuto della confezione
</h2>



<ul>

{{CONTENUTO}}

</ul>


</div>





<!-- NOTA -->


<div style="
margin-top:20px;
background:#fff8e1;
border-left:5px solid #e28413;
padding:15px;
">


<strong>Nota:</strong>


{{NOTA}}


</div>



</div>
